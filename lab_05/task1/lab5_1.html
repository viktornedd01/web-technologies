<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="travelling-plan">
        <h1 class="travelling-plan__title">План подорожі:</h1>

        <ul class="stage-list">
            <li class="stage-list__item icon icon-checklist">
                <span class="stage-list__title">Підготовчий етап</span>
                <ul class="activity-list">
                    <li class="activity-list__item icon icon-route">
                        <span class="activity-list__name">Обрати маршрут</span>
                    </li>
                    <li class="activity-list__item icon icon-tickets">
                        <span class="activity-list__name">Квитки на літак</span>
                    </li>
                    <li class="activity-list__item icon icon-hotel">
                        <span class="activity-list__name">Готель</span>
                    </li>
                    <li class="activity-list__item icon icon-car">
                        <span class="activity-list__name">Оренда авто</span>
                    </li>
                </ul>
            </li>

            <li class="stage-list__item icon icon-checklist">
                <span class="stage-list__title">Відпочинок</span>
                <ul class="activity-list">
                    <li class="activity-list__item icon icon-bars">
                        <span class="activity-list__name">Бари</span>
                    </li>
                    <li class="activity-list__item icon icon-casino">
                        <span class="activity-list__name">Казино</span>
                    </li>
                    <li class="activity-list__item icon icon-museums">
                        <span class="activity-list__name">Музеї</span>
                    </li>
                    <li class="activity-list__item icon icon-festivals">
                        <span class="activity-list__name">Фестивалі</span>
                    </li>
                </ul>
            </li>
        </ul>
    </div>
</body>
</html>
