<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather">
        <div class="card"></div>

        <div class="cloud">
            <div class="cloud-part cloud-base"></div>
            <div class="cloud-part cloud-top-left"></div>
            <div class="cloud-part cloud-top-right"></div>
            <div class="cloud-part cloud-left"></div>
            <div class="cloud-part cloud-right"></div>
        </div>

        <div class="temperature">17</div>

        <div class="arrows">
            <span class="arrow">&larr;</span>
            <span class="arrow">&rarr;</span>
        </div>

        <ul class="forecast">
            <li class="forecast-day">
                <span class="forecast-weekday">Mon</span>
                <span class="forecast-temperature">17°</span>
            </li>
            <li class="forecast-day">
                <span class="forecast-weekday">Tue</span>
                <span class="forecast-temperature">19°</span>
            </li>
            <li class="forecast-day">
                <span class="forecast-weekday">Wed</span>
                <span class="forecast-temperature">16°</span>
            </li>
            <li class="forecast-day">
                <span class="forecast-weekday">Thu</span>
                <span class="forecast-temperature">18°</span>
            </li>
            <li class="forecast-day">
                <span class="forecast-weekday">Fri</span>
                <span class="forecast-temperature">21°</span>
            </li>
        </ul>
    </div>
</body>
</html>
