<body>
    <div align="center">
        <h2>Хімічні та математичні формули</h2>
        <ul>
            <li><em><strong>Вода</strong></em>: H<sub>2</sub>O</li>
            <li><em><strong>Сірчана кислота</strong></em>: H<sub>2</sub>SO<sub>4</sub></li>
            <li><em><strong>Глюкоза</strong></em>: C<sub>6</sub>H<sub>12</sub>O<sub>6</sub></li>
            <li><em><strong>Карбонат кальцію</strong></em>: CaCO<sub>3</sub></li>
            <li><em><strong>Реакція горіння метану</strong></em>: CH<sub>4</sub> + 2O<sub>2</sub> → CO<sub>2</sub> + 2H<sub>2</sub>O</li>
            <li><em><strong>Квадратне рівняння</strong></em>: ax<sup>2</sup> + bx + c = 0</li>
            <li><em><strong>Число Авогадро</strong></em>: 6,022 • 10<sup>23</sup> моль<sup>-1</sup></li>
        </ul>
    </div>
</body>
